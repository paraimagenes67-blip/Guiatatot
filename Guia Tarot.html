<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía Tarot - 78 Cartas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            gold: {
              300: '#fde047',
              400: '#facc15',
              500: '#eab308',
              600: '#ca8a04',
            },
            mystic: {
              900: '#0B0A16',
              800: '#15122B',
              700: '#211C42',
              600: '#322B60',
              accent: '#8B5CF6'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top, #1a1638 0%, #08070e 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    /* Custom Scrollbar for horizontal card spread */
    .custom-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 12, 29, 0.6);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(234, 179, 8, 0.4);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(234, 179, 8, 0.7);
    }
    /* Flip Transition */
    .card-flipped {
      transform: rotate(180deg);
    }
    .gold-glow {
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
    }
    .gold-border-glow {
      border-color: rgba(234, 179, 8, 0.5);
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-200 pb-20">

  <!-- TOP HEADER -->
  <header class="border-b border-gold-500/20 bg-mystic-900/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-600 to-amber-300 flex items-center justify-center text-mystic-900 font-cinzel font-bold text-xl shadow-lg">
          🔮
        </div>
        <div>
          <h1 class="font-cinzel text-2xl md:text-3xl font-bold bg-gradient-to-r from-amber-200 via-gold-400 to-amber-100 bg-clip-text text-transparent">
            Guía Tarot
          </h1>
          <p class="text-xs text-slate-400">Guía Completa de los 78 Arcanos</p>
        </div>
      </div>

      <!-- Quick Stats / Actions -->
      <div class="flex items-center gap-3">
        <button onclick="clearSpread()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-red-500/40 bg-red-500/10 text-red-300 hover:bg-red-500/20 transition-all">
          Limpiar Tirada
        </button>
        <button onclick="randomSpread(3)" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-gold-500/50 bg-gold-500/10 text-gold-300 hover:bg-gold-500/20 transition-all flex items-center gap-1">
          ✨ Tirada de 3 Cartas
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- SEARCH & CATEGORY SUIT FILTER BAR -->
    <section class="bg-mystic-800/80 rounded-2xl p-4 sm:p-6 border border-gold-500/20 shadow-xl backdrop-blur-md">
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        
        <!-- Search Input -->
        <div class="relative w-full md:w-80">
          <input type="text" id="searchInput" oninput="filterCards()" placeholder="Buscar carta por nombre o palabra clave..." 
            class="w-full pl-10 pr-4 py-2.5 bg-mystic-900/90 border border-slate-700 rounded-xl focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-sm transition-all placeholder:text-slate-500">
          <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Filter Tabs -->
        <div class="flex flex-wrap gap-1.5 w-full md:w-auto justify-center md:justify-end" id="suitFilterContainer">
          <button onclick="setSuitFilter('all')" data-suit="all" class="suit-btn active px-3.5 py-2 rounded-xl text-xs font-semibold bg-gold-500 text-mystic-900 transition-all">
            Todas (78)
          </button>
          <button onclick="setSuitFilter('major')" data-suit="major" class="suit-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-mystic-900/80 border border-slate-700 text-slate-300 hover:border-gold-500/50 transition-all">
            Arcanos Mayores (22)
          </button>
          <button onclick="setSuitFilter('wands')" data-suit="wands" class="suit-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-mystic-900/80 border border-slate-700 text-slate-300 hover:border-gold-500/50 transition-all">
            🪄 Bastos
          </button>
          <button onclick="setSuitFilter('cups')" data-suit="cups" class="suit-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-mystic-900/80 border border-slate-700 text-slate-300 hover:border-gold-500/50 transition-all">
            🏆 Copas
          </button>
          <button onclick="setSuitFilter('swords')" data-suit="swords" class="suit-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-mystic-900/80 border border-slate-700 text-slate-300 hover:border-gold-500/50 transition-all">
            ⚔️ Espadas
          </button>
          <button onclick="setSuitFilter('pentacles')" data-suit="pentacles" class="suit-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-mystic-900/80 border border-slate-700 text-slate-300 hover:border-gold-500/50 transition-all">
            🪙 Pentáculos
          </button>
        </div>

      </div>
    </section>

    <!-- SECTION 1: ALL CARDS GRID CATALOGUE (FIRST AS REQUESTED) -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-cinzel text-xl font-bold text-slate-200 flex items-center gap-2">
          <span>🃏</span> Catálogo Completo (78 Cartas)
        </h2>
        <span id="gridCounter" class="text-xs text-slate-400 font-mono">Mostrando 78 cartas</span>
      </div>

      <!-- Main Cards Grid -->
      <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
        <!-- Rendered dynamically via JS -->
      </div>
    </section>

    <!-- SECTION 2: STICKY HORIZONTAL SPREAD DISPLAY ("TIRADA ACTUAL") -->
    <section id="spreadSection" class="sticky bottom-4 z-30 transition-all">
      <div class="bg-mystic-800/95 border-2 border-gold-500/40 rounded-2xl p-4 sm:p-5 shadow-2xl backdrop-blur-xl gold-glow">
        <div class="flex items-center justify-between mb-3 border-b border-slate-700/60 pb-2">
          <div class="flex items-center gap-2">
            <span class="text-xl">✨</span>
            <h2 class="font-cinzel text-lg font-bold text-gold-400">Tirada Actual</h2>
            <span id="spreadCountBadge" class="bg-gold-500/20 text-gold-300 border border-gold-500/30 text-xs px-2.5 py-0.5 rounded-full font-mono">0 cartas</span>
          </div>
          <span class="text-xs text-slate-400 hidden sm:inline">Desliza horizontalmente para ver todas ➔</span>
        </div>

        <!-- HORIZONTAL CARDS CONTAINER -->
        <div id="spreadContainer" class="flex gap-4 overflow-x-auto custom-scroll pb-3 min-h-[180px] items-stretch">
          <!-- Empty State -->
          <div id="emptySpreadMsg" class="w-full flex flex-col items-center justify-center py-8 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
            <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
            <p class="text-sm font-medium">No has seleccionado ninguna carta</p>
            <p class="text-xs text-slate-500 mt-1">Haz clic en cualquier carta del catálogo arriba para añadirla a tu lectura</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- JS DATA & CONTROLLER LOGIC -->

      // Clean and safe SVG data URI fallback
      var cleanName = name.replace(/["'&<>]/g, '');
      var svgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="340" viewBox="0 0 200 340">' +
        '<rect width="200" height="340" fill="#1d1738" rx="12" stroke="#eab308" stroke-width="3"/>' +
        '<rect x="10" y="10" width="180" height="320" fill="none" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4 2"/>' +
        '<text x="100" y="160" fill="#fde047" font-family="serif" font-size="28" text-anchor="middle">🔮</text>' +
        '<text x="100" y="200" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">' + cleanName + '</text>' +
        '</svg>';
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgContent);
    }

    // STATE CONTROL
    var spreadState = [];
    var currentSuitFilter = 'all';

    // INITIALIZATION
    window.onload = function() {
      renderCatalogueGrid();
      updateSpreadUI();
    };

    // FILTER CARDS FUNCTIONALITY
    function setSuitFilter(suit) {
      currentSuitFilter = suit;
      document.querySelectorAll('.suit-btn').forEach(function(btn) {
        if(btn.dataset.suit === suit) {
          btn.className = "suit-btn active px-3.5 py-2 rounded-xl text-xs font-semibold bg-gold-500 text-mystic-900 transition-all shadow-md shadow-gold-500/20";
        } else {
          btn.className = "suit-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-mystic-900/80 border border-slate-700 text-slate-300 hover:border-gold-500/50 transition-all";
        }
      });
      filterCards();
    }

    function filterCards() {
      var query = document.getElementById('searchInput').value.toLowerCase().trim();
      var filtered = tarotCards.filter(function(card) {
        var matchesSuit = (currentSuitFilter === 'all') || (card.suit === currentSuitFilter);
        var matchesQuery = card.name.toLowerCase().indexOf(query) !== -1 || 
                             card.upright.toLowerCase().indexOf(query) !== -1 || 
                             card.reversed.toLowerCase().indexOf(query) !== -1;
        return matchesSuit && matchesQuery;
      });

      renderCatalogueGrid(filtered);
    }

    // RENDER CATALOGUE GRID
    function renderCatalogueGrid(cardsToRender) {
      cardsToRender = cardsToRender || tarotCards;
      var container = document.getElementById('cardsGrid');
      var counter = document.getElementById('gridCounter');
      counter.textContent = 'Mostrando ' + cardsToRender.length + ' cartas';

      if(cardsToRender.length === 0) {
        container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400">No se encontraron cartas que coincidan con tu búsqueda.</div>';
        return;
      }

      container.innerHTML = cardsToRender.map(function(card) {
        var safeName = card.name.replace(/"/g, '&quot;');
        return '<div onclick="addCardToSpread(' + card.id + ')" ' +
             'class="group relative bg-mystic-800/90 border border-slate-700/80 hover:border-gold-500/60 rounded-xl p-2.5 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-gold-500/10 cursor-pointer flex flex-col justify-between">' +
          '<div class="aspect-[9/16] overflow-hidden rounded-lg bg-mystic-900 relative mb-2">' +
            '<img src="' + card.image + '" alt="' + safeName + '" loading="lazy" ' +
                 'data-name="' + safeName + '" ' +
                 'onerror="this.onerror=null; this.src=getCardImageSvg(this.getAttribute(\'data-name\'));" ' +
                 'class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">' +
          '</div>' +
          '<div>' +
            '<h3 class="font-cinzel text-xs font-bold text-slate-200 group-hover:text-gold-400 truncate">' + card.name + '</h3>' +
            '<span class="text-[10px] text-slate-400 block mt-0.5">Si/No: <strong class="text-gold-400">' + card.yesNo + '</strong></span>' +
          '</div>' +
          '<button class="mt-2 w-full py-1 text-[11px] font-semibold bg-mystic-700 hover:bg-gold-500 hover:text-mystic-900 text-slate-300 rounded-md transition-colors flex items-center justify-center gap-1">' +
            '<span>+</span> Añadir' +
          '</button>' +
        '</div>';
      }).join('');
    }

    // SPREAD MANAGEMENT (TIRADA ACTUAL)
    function addCardToSpread(cardId) {
      var card = tarotCards.find(function(c) { return c.id === cardId; });
      if(!card) return;

      var instanceId = 'spread_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
      spreadState.push({
        card: card,
        isReversed: false,
        instanceId: instanceId
      });

      updateSpreadUI();
      
      // Auto-scroll to the right in the spread container
      setTimeout(function() {
        var spreadContainer = document.getElementById('spreadContainer');
        if (spreadContainer) {
          spreadContainer.scrollTo({ left: spreadContainer.scrollWidth, behavior: 'smooth' });
        }
      }, 50);
    }

    function toggleFlip(instanceId) {
      var item = spreadState.find(function(s) { return s.instanceId === instanceId; });
      if(item) {
        item.isReversed = !item.isReversed;
        updateSpreadUI();
      }
    }

    function removeFromSpread(instanceId) {
      spreadState = spreadState.filter(function(s) { return s.instanceId !== instanceId; });
      updateSpreadUI();
    }

    function clearSpread() {
      spreadState = [];
      updateSpreadUI();
    }

    function randomSpread(count) {
      count = count || 3;
      spreadState = [];
      var shuffled = [...tarotCards].sort(function() { return 0.5 - Math.random(); });
      var selected = shuffled.slice(0, count);
      
      selected.forEach(function(card) {
        spreadState.push({
          card: card,
          isReversed: Math.random() > 0.5,
          instanceId: 'spread_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4)
        });
      });

      updateSpreadUI();
    }

    // UPDATE HORIZONTAL SPREAD DISPLAY ("TIRADA ACTUAL")
    function updateSpreadUI() {
      var container = document.getElementById('spreadContainer');
      var countBadge = document.getElementById('spreadCountBadge');

      countBadge.textContent = spreadState.length + ' ' + (spreadState.length === 1 ? 'carta' : 'cartas');

      if (spreadState.length === 0) {
        container.innerHTML = '<div id="emptySpreadMsg" class="w-full flex flex-col items-center justify-center py-8 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">' +
            '<svg class="w-8 h-8 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
              '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>' +
            '</svg>' +
            '<p class="text-xs sm:text-sm font-medium">No has seleccionado ninguna carta</p>' +
            '<p class="text-[11px] text-slate-500 mt-0.5">Selecciona cartas arriba para crear tu lectura en horizontal</p>' +
          '</div>';
        return;
      }

      // Render cards HORIZONTALLY side-by-side
      container.innerHTML = spreadState.map(function(item, index) {
        var card = item.card;
        var isReversed = item.isReversed;
        var instanceId = item.instanceId;
        var safeName = card.name.replace(/"/g, '&quot;');

        return '<div class="flex-none w-[260px] sm:w-[290px] bg-mystic-900/90 border border-gold-500/30 rounded-xl p-3 flex flex-col justify-between shadow-xl relative group">' +
            '<!-- Top Controls Badge -->' +
            '<div class="flex items-center justify-between mb-2">' +
              '<span class="text-[10px] font-mono uppercase tracking-wider text-gold-400 bg-gold-500/10 px-2 py-0.5 rounded border border-gold-500/20">' +
                'Posición #' + (index + 1) +
              '</span>' +
              '<button onclick="removeFromSpread(\'' + instanceId + '\')" title="Quitar carta" ' +
                'class="text-slate-400 hover:text-red-400 transition-colors p-1 text-sm font-bold">' +
                '✕' +
              '</button>' +
            '</div>' +

            '<!-- Card Image & Flip Action -->' +
            '<div class="flex gap-3 items-start mb-3">' +
              '<div class="w-20 h-32 flex-none bg-mystic-950 rounded-lg overflow-hidden border border-slate-700 relative shadow-inner">' +
                '<img src="' + card.image + '" alt="' + safeName + '" ' +
                     'data-name="' + safeName + '" ' +
                     'onerror="this.onerror=null; this.src=getCardImageSvg(this.getAttribute(\'data-name\'));" ' +
                     'class="w-full h-full object-cover transition-transform duration-500 ' + (isReversed ? 'rotate-180' : '') + '">' +
              '</div>' +

              '<div class="flex-1 min-w-0">' +
                '<h3 class="font-cinzel text-sm font-bold text-slate-100 truncate">' + card.name + '</h3>' +
                
                '<div class="mt-1.5 flex items-center gap-1">' +
                  '<span class="text-[11px] font-semibold ' + (isReversed ? 'text-amber-400' : 'text-emerald-400') + '">' +
                    (isReversed ? '🔄 Invertida' : '✨ Al Derecho') +
                  '</span>' +
                '</div>' +

                '<p class="text-[10px] text-slate-400 mt-1">' +
                  '<strong>Respuesta:</strong> <span class="text-gold-300 font-semibold">' + card.yesNo + '</span>' +
                '</p>' +

                '<!-- Flip Toggle Button -->' +
                '<button onclick="toggleFlip(\'' + instanceId + '\')" ' +
                  'class="mt-2 text-[10px] w-full py-1 px-2 rounded bg-mystic-700/80 hover:bg-gold-500 hover:text-mystic-900 border border-slate-600 transition-colors flex items-center justify-center gap-1 font-medium">' +
                  '🔄 Voltear' +
                '</button>' +
              '</div>' +
            '</div>' +

            '<!-- Meanings Summary Box -->' +
            '<div class="bg-mystic-800/80 rounded-lg p-2.5 border border-slate-700/50 text-[11px] leading-relaxed space-y-1.5">' +
              '<div>' +
                '<span class="text-emerald-400 font-semibold block text-[10px] uppercase tracking-wider">Significado Al Derecho:</span>' +
                '<p class="text-slate-300 ' + (!isReversed ? 'font-medium text-slate-100' : 'opacity-70') + '">' + card.upright + '</p>' +
              '</div>' +
              '<div class="border-t border-slate-700/50 pt-1.5">' +
                '<span class="text-amber-400 font-semibold block text-[10px] uppercase tracking-wider">Significado Invertido:</span>' +
                '<p class="text-slate-300 ' + (isReversed ? 'font-medium text-slate-100' : 'opacity-70') + '">' + card.reversed + '</p>' +
              '</div>' +
            '</div>' +

          '</div>';
      }).join('');
    }
  </script>
